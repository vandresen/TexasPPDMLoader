name: Release

on:
  workflow_dispatch:
    inputs:
      versionNumber:
        description: "Version number"
        required: true

jobs:
  build:
    name: Build release
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          
      - name: Restore
        run: dotnet restore
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Publish (Self-contained, single-file)
        run: |
          dotnet publish ./TexasPPDMLoader/TexasPPDMLoader.csproj `
            --configuration Release `
            --self-contained true `
            -r win-x64 `
            -p:PublishSingleFile=true `
            --output ./output

      - name: List output
        run: dir ./output

      - name: Read CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload artifact (optional but clean)
        uses: actions/upload-artifact@v4
        with:
          name: TexasPPDMLoader
          path: ./output/TexasPPDMLoader.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.versionNumber }}
          name: "TexasPPDMLoader v${{ github.event.inputs.versionNumber }}"
          files: ./output/TexasPPDMLoader.exe
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


